services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: discord_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/discord_clone
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LIVEKIT_PUBLIC_WS_URL: wss://${DOMAIN}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      PUBLIC_ORIGIN: https://${DOMAIN}
      GCS_CREDENTIALS_JSON: ${GCS_CREDENTIALS_JSON:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      DESKTOP_MIN_VERSION: ${DESKTOP_MIN_VERSION:-}
      DESKTOP_DOWNLOAD_URL: ${DESKTOP_DOWNLOAD_URL:-https://187-127-37-101.sslip.io/login}
      MUSIC_BOT_URL: http://music-bot:4001
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - postgres
      - livekit
      - music-bot
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  music-bot:
    build: ./music-bot
    restart: unless-stopped
    environment:
      LIVEKIT_WS_URL: wss://${DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BACKEND_URL: http://backend:8080
      POT_PROVIDER_URL: http://pot-provider:4416
    volumes:
      - ./music-bot/data:/app/data
    dns:
      - 8.8.8.8
      - 1.1.1.1

    depends_on:
      - livekit
      - pot-provider

  gateway:
    build: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - webproxy
    depends_on:
      - backend
      - livekit

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  default: {}
  webproxy:
    name: webproxy
