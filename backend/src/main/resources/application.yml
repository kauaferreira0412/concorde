server:
  port: 8080

spring:
  application:
    name: concorde-backend
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  datasource:
    url: jdbc:postgresql://localhost:5432/discord_clone
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
app:
  cors:
    allowed-origins: "http://localhost:5173,http://192.168.1.199:5173,https://*.ngrok-free.app,https://*.ngrok-free.dev,https://*.ngrok.io,${PUBLIC_ORIGIN:},app://."
  jwt:
    secret: "troque-este-segredo-por-um-valor-forte-de-32-bytes-no-minimo"
    expiration-minutes: 1440
  desktop:
    min-version-override: ${DESKTOP_MIN_VERSION:}
    download-url: ${DESKTOP_DOWNLOAD_URL:https://187-127-37-101.sslip.io/login}
  music-bot:
    url: ${MUSIC_BOT_URL:http://localhost:4001}
  admin:
    username: "admin"
    email: "admin@codagis.local"
    password: ${ADMIN_PASSWORD:}
  livekit:
    ws-url: ${LIVEKIT_PUBLIC_WS_URL:ws://192.168.1.199:7880}
    internal-url: ${LIVEKIT_INTERNAL_URL:}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:devsecret1234567890devsecret1234567890}
    token-ttl-minutes: 60
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
    base-folder: ${STORAGE_BASE_FOLDER:potato}
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    # Precisa bater EXATAMENTE com uma das Redirect URIs cadastradas no Spotify Developer
    # Dashboard (ver SpotifyService/SettingsModal.jsx) - o padrao local usa 127.0.0.1 (nao
    # "localhost") porque o Spotify so' aceita http:// sem certificado nesse endereco exato.
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/spotify/callback}
